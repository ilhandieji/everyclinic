services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"

  volume-init:
    image: alpine:3.20
    command:
      - chown
      - -R
      - "${UID:-1000}:${GID:-1000}"
      - /vol/next
      - /vol/node_modules
      - /vol/storage
    volumes:
      - next_cache:/vol/next
      - node_modules:/vol/node_modules
      - uploads:/vol/storage

  app:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://clinic:clinic@db:5432/clinic
      HOME: /tmp/app-home
      COREPACK_HOME: /usr/local/share/corepack
      NPM_CONFIG_CACHE: /tmp/.npm
      XDG_CACHE_HOME: /tmp/.cache
      PNPM_HOME: /tmp/app-home/.local/share/pnpm
    volumes:
      - .:/app
      - next_cache:/app/.next
      - node_modules:/app/node_modules
      - uploads:/app/storage
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  next_cache:
  node_modules:
  uploads:
